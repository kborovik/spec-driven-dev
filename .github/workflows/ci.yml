name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-mechanical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: self-test
        run: python3 scripts/check-mechanical.py --self-test
      - name: mechanical audit
        run: |
          out=$(python3 scripts/check-mechanical.py audit --no-hook)
          echo "$out"
          if echo "$out" | grep -E '\|(VIOLATE|UNVERIFIABLE|UNRESOLVED|TYPE-MISMATCH|DRIFT|MISSING|STALE|EXTRA)\|'; then
            echo "dirty verdicts found — see rows above" >&2
            exit 1
          fi
